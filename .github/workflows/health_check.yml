name: Dashboard Health Check

# Vérifie quotidiennement que toutes les sources du baromètre répondent
# (CSV Google Sheets, dashboard GitHub Pages, iframes Zoho, APIs BCE/XAG,
# site TaiyangNews). En cas d'échec, le job échoue ET ouvre/actualise un
# ticket GitHub Issue assigné + @mention (action composite pipeline-alert,
# incident 2026-09-18/21 : la notification email native GitHub Actions ne
# suffit pas seule si Settings → Notifications → Actions n'est pas cochée
# sur le compte — vérifier ce réglage reste recommandé en complément).

on:
  schedule:
    # Tous les jours à 07:00 UTC (avant le scraper du lundi 08:00)
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run health check
        id: healthcheck
        run: |
          set -o pipefail
          python pv-price-scraper/health_check.py 2>&1 | tee health_check_output.log

      - name: Extraire le détail de l'erreur (si échec)
        id: healthcheck-error
        if: failure()
        run: |
          DETAIL="voir les logs du run ci-dessus"
          if [ -f health_check_output.log ]; then
            FOUND=$(grep -E "ÉCHEC|ERROR" health_check_output.log || true)
            if [ -n "$FOUND" ]; then DETAIL="$FOUND"; fi
          fi
          {
            echo "detail<<PIPELINE_ALERT_EOF"
            echo "$DETAIL"
            echo "PIPELINE_ALERT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alerte pipeline — échec
        if: failure()
        uses: ./.github/actions/pipeline-alert
        with:
          status: failure
          alert-key: health-check
          workflow-name: "Dashboard Health Check"
          details: ${{ steps.healthcheck-error.outputs.detail }}

      - name: Alerte pipeline — résolution
        if: success()
        uses: ./.github/actions/pipeline-alert
        with:
          status: success
          alert-key: health-check
          workflow-name: "Dashboard Health Check"
