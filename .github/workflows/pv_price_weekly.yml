name: TaiyangNews PV Price Index

on:
  schedule:
    # Chaque vendredi à 08:00 UTC (TaiyangNews publie mercredi/jeudi)
    - cron: "0 8 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: false
        default: "weekly"
        type: choice
        options:
          - weekly
          - backfill
          - force
      week:
        description: "Semaine ISO à forcer (ex: 22) — weekly mode uniquement"
        required: false
        type: string
      year:
        description: "Année à forcer (ex: 2026) — weekly mode uniquement"
        required: false
        type: string

concurrency:
  group: pv-scraper
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pv-price-scraper/requirements.txt

      - name: Run force rescrape (overwrite all weeks)
        if: ${{ github.event.inputs.mode == 'force' }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          cd pv-price-scraper && python backfill.py --force 2>&1 | tee scraper_output.log

      - name: Run backfill complet
        if: ${{ github.event.inputs.mode == 'backfill' }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          cd pv-price-scraper && python backfill.py 2>&1 | tee scraper_output.log

      - name: Run weekly scraper
        if: ${{ github.event.inputs.mode != 'backfill' && github.event.inputs.mode != 'force' }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.week }}" ]; then ARGS="$ARGS --week ${{ github.event.inputs.week }}"; fi
          if [ -n "${{ github.event.inputs.year }}" ]; then ARGS="$ARGS --year ${{ github.event.inputs.year }}"; fi
          cd pv-price-scraper && python taiyangnews_pv_scraper.py $ARGS 2>&1 | tee scraper_output.log

      - name: Extraire le détail de l'erreur (si échec)
        id: scraper-error
        if: failure()
        run: |
          DETAIL="voir les logs du run ci-dessus"
          if [ -f pv-price-scraper/scraper_output.log ]; then
            FOUND=$(grep -E "ERROR|WARNING" pv-price-scraper/scraper_output.log | tail -3 || true)
            if [ -n "$FOUND" ]; then DETAIL="$FOUND"; fi
          fi
          {
            echo "detail<<PIPELINE_ALERT_EOF"
            echo "$DETAIL"
            echo "PIPELINE_ALERT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alerte pipeline — échec
        if: failure()
        uses: ./.github/actions/pipeline-alert
        with:
          status: failure
          alert-key: pv-price-weekly
          workflow-name: "TaiyangNews PV Price Index (scraper hebdomadaire)"
          details: ${{ steps.scraper-error.outputs.detail }}

      - name: Alerte pipeline — résolution
        if: success()
        uses: ./.github/actions/pipeline-alert
        with:
          status: success
          alert-key: pv-price-weekly
          workflow-name: "TaiyangNews PV Price Index (scraper hebdomadaire)"
